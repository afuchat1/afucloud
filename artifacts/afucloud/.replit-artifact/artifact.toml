kind = "web"
previewPath = "/"
title = "AfuCloud"
version = "1.0.0"
id = "artifacts/afucloud"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21380

[services.development]
run = "pnpm --filter @workspace/afucloud run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/afucloud", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/afucloud", "run", "start" ]

[services.production.run.env]
PORT = "21380"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "21380"
BASE_PATH = "/"
