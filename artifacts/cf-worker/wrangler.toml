# Canonical production API Worker. All AfuCloud projects use this Worker.
# Do not create additional production Workers; add routes here instead.
name = "afucloud-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "42e79186125e8ff83e51f15816e074de"

# ── Routes ───────────────────────────────────────────────────────────────────
routes = [
  { pattern = "api.afuchat.com", zone_name = "afuchat.com" },
  { pattern = "api.afuchat.com/*", zone_name = "afuchat.com" }
]

# ── R2 Bucket binding ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "afucloud-images"
# preview_bucket_name = "afucloud-images-dev"  # uncomment for local dev

# ── Vars (non-secret) ─────────────────────────────────────────────────────────
[vars]
SUPABASE_URL = "https://poijhidfekwfthyksatp.supabase.co"
SUPABASE_PROJECT_ID = "poijhidfekwfthyksatp"
SUPABASE_DB_SCHEMA = "afucloud"
R2_BUCKET_NAME = "afucloud-images"
CLOUDFLARE_ACCOUNT_ID = "42e79186125e8ff83e51f15816e074de"
AFU_CUSTOM_HOSTNAME_TARGET = "verify.afuchat.com"
CLOUDFLARE_R2_ACCESS_KEY_ID = "40916680c4892042d4ce49396ef62819"
API_BASE_URL = "https://api.afuchat.com"
CLOUDFLARE_OAUTH_REDIRECT_URI = "https://api.afuchat.com/v1/cloudflare/callback"
NODE_ENV = "production"
# Comma-separated exact dashboard origins outside the default *.afuchat.com allowlist.
DASHBOARD_ALLOWED_ORIGINS = ""
WHOP_COMPANY_ID = "biz_7FEyvmraYbNtnS"
WHOP_PRODUCT_ID = "prod_OCTeUVfYRo4E8"
WHOP_PRO_PLAN_ID = "plan_acE7UJbwvOiMM"
WHOP_BUSINESS_PLAN_ID = "plan_rHNQbmHe5SLw1"

# ── Secrets (set via: wrangler secret put SECRET_NAME) ────────────────────────
# SUPABASE_SERVICE_KEY      — Supabase service role key
# JWT_SECRET                — JWT signing secret
# CLOUDFLARE_R2_SECRET_ACCESS_KEY  — R2 S3-compatible secret key
# CLOUDFLARE_OAUTH_CLIENT_ID — OAuth client ID
# CLOUDFLARE_OAUTH_CLIENT_SECRET — OAuth client secret
# CLOUDFLARE_OAUTH_STATE_SECRET — HMAC key for one-time OAuth state
# CLOUDFLARE_TOKEN_ENCRYPTION_KEY — 32-byte base64url key for stored OAuth tokens
# CLOUDFLARE_REGISTRAR_API_TOKEN — account API token with Registrar Write permission
# WHOP_API_KEY — server-side API key for the existing Whop account

# ── Dev environment overrides ─────────────────────────────────────────────────
[env.dev]
vars = { NODE_ENV = "development" }
