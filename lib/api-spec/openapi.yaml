openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: AfuCloud API – cloud platform for storing, managing, and delivering digital assets
servers:
  - url: /api
    description: Base API path
security:
  - BearerAuth: []
tags:
  - name: health
  - name: projects
  - name: images
  - name: api-keys
  - name: tokens
  - name: webhooks
  - name: activity
  - name: domains
  - name: cloudflare

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── PROJECTS ───
  /v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all user projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /v1/projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/projects/{id}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get storage and usage stats for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  # ─── IMAGES ───
  /v1/projects/{projectId}/images:
    get:
      operationId: listImages
      tags: [images]
      summary: List images in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: album
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Image list with pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"

  /v1/projects/{projectId}/images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get image details
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
    patch:
      operationId: updateImage
      tags: [images]
      summary: Update image metadata
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpdate"
      responses:
        "200":
          description: Image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete (soft-delete) an image
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/projects/{projectId}/images/{id}/favorite:
    patch:
      operationId: toggleImageFavorite
      tags: [images]
      summary: Toggle image favorite status
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"

  /v1/projects/{projectId}/images/{id}/restore:
    post:
      operationId: restoreImage
      tags: [images]
      summary: Restore a soft-deleted image
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"

  /v1/projects/{projectId}/images/upload-url:
    post:
      operationId: getUploadUrl
      tags: [images]
      summary: Get a pre-signed URL for direct upload
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Pre-signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /v1/projects/{projectId}/images/confirm-upload:
    post:
      operationId: confirmUpload
      tags: [images]
      summary: Confirm a completed direct upload and persist image record
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmUploadInput"
      responses:
        "201":
          description: Image record confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"

  # ─── API KEYS ───
  /v1/projects/{projectId}/api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API keys for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create a new API key
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"

  /v1/projects/{projectId}/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── PERSONAL ACCESS TOKENS ───
  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List personal access tokens
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Token"
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "201":
          description: Token created (secret shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenWithSecret"

  /v1/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a personal access token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── WEBHOOKS ───
  /v1/projects/{projectId}/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhooks for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"

  /v1/projects/{projectId}/webhooks/{id}:
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdate"
      responses:
        "200":
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── ACTIVITY LOGS ───
  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity logs for the user
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get account-wide analytics overview
      responses:
        "200":
          description: Account analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewResponse"

  /v1/projects/{projectId}/analytics:
    get:
      operationId: getProjectAnalytics
      tags: [analytics]
      summary: Get analytics for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: Project analytics and daily usage series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalyticsResponse"

  /v1/cloudflare/connection:
    get:
      operationId: getCloudflareConnection
      tags: [cloudflare]
      summary: Get the current user's Cloudflare connection status
      responses:
        "200":
          description: Cloudflare connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareConnectionStatus"
    delete:
      operationId: disconnectCloudflare
      tags: [cloudflare]
      summary: Revoke and remove the current user's Cloudflare connection
      responses:
        "200":
          description: Connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/cloudflare/connect:
    post:
      operationId: startCloudflareAuthorization
      tags: [cloudflare]
      summary: Start Cloudflare OAuth authorization
      responses:
        "200":
          description: Cloudflare authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareAuthorizationResponse"

  /v1/cloudflare/zones:
    get:
      operationId: listCloudflareZones
      tags: [cloudflare]
      summary: List zones accessible through the current user's Cloudflare connection
      responses:
        "200":
          description: Cloudflare zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudflareZone"

  /v1/domains/{domainId}/dns-records:
    get:
      operationId: listDomainDnsRecords
      tags: [domains]
      summary: List DNS records in the user's Cloudflare zone for this domain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: DNS zone and its matching records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareDnsRecordsResponse"
    post:
      operationId: createDomainDnsRecord
      tags: [domains]
      summary: Create a DNS record in the user's Cloudflare zone
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareDnsRecordInput"
      responses:
        "201":
          description: DNS record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareDnsRecord"

  /v1/domains/{domainId}/dns-records/{recordId}:
    patch:
      operationId: updateDomainDnsRecord
      tags: [domains]
      summary: Update a DNS record in the user's Cloudflare zone
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareDnsRecordInput"
      responses:
        "200":
          description: DNS record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareDnsRecord"
    delete:
      operationId: deleteDomainDnsRecord
      tags: [domains]
      summary: Delete a DNS record from the user's Cloudflare zone
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DNS record deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/domains/{domainId}/dns-records/{recordId}/verify:
    post:
      operationId: verifyDomainDnsRecord
      tags: [domains]
      summary: Check Cloudflare configuration and public DNS propagation for a record
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DNS verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareDnsVerification"

  /v1/domains/{domainId}/auto-configure:
    post:
      operationId: autoConfigureDomainVerification
      tags: [domains]
      summary: Create the domain ownership TXT record in the connected Cloudflare zone
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain verification DNS record configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudflareDnsAutoConfiguration"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AfuCloudCredential
  schemas:
    # ─── Core ───
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AnalyticsOverviewResponse:
      type: object
      required: [totalProjects, totalImages, totalStorageUsed, totalBandwidth, totalApiRequests, recentUploads]
      properties:
        totalProjects:
          type: number
        totalImages:
          type: number
        totalStorageUsed:
          type: number
        totalBandwidth:
          type: number
        totalApiRequests:
          type: number
        recentUploads:
          type: number

    ProjectAnalyticsResponse:
      type: object
      required: [uploads, downloads, storageUsed, bandwidth, apiRequests, dailyStats]
      properties:
        uploads:
          type: number
        downloads:
          type: number
        storageUsed:
          type: number
        bandwidth:
          type: number
        apiRequests:
          type: number
        dailyStats:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDailyStat"

    ProjectDailyStat:
      type: object
      required: [date, uploads, downloads, bandwidth]
      properties:
        date:
          type: string
        uploads:
          type: number
        downloads:
          type: number
        bandwidth:
          type: number

    # ─── Projects ───
    Project:
      type: object
      required: [id, name, slug, userId, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        userId:
          type: string
        imageCount:
          type: number
        storageUsed:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]

    ProjectStats:
      type: object
      required: [totalImages, storageUsed, bandwidth, apiRequests]
      properties:
        totalImages:
          type: number
        storageUsed:
          type: number
        bandwidth:
          type: number
        apiRequests:
          type: number
        deletedImages:
          type: number
        favoriteImages:
          type: number

    # ─── Images ───
    Image:
      type: object
      required: [id, projectId, name, url, format, size, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        originalName:
          type: ["string", "null"]
        url:
          type: string
        publicUrl:
          type: ["string", "null"]
        downloadUrl:
          type: string
        format:
          type: string
        size:
          type: number
        width:
          type: ["number", "null"]
        height:
          type: ["number", "null"]
        favorite:
          type: boolean
        tags:
          type: array
          items:
            type: string
        album:
          type: ["string", "null"]
        deletedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ImageListResponse:
      type: object
      required: [images, total, page, limit]
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    ImageUpdate:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        album:
          type: ["string", "null"]

    UploadUrlInput:
      type: object
      required: [filename, contentType]
      properties:
        filename:
          type: string
        contentType:
          type: string
        name:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadUrl, imageId, key]
      properties:
        uploadUrl:
          type: string
        imageId:
          type: string
        key:
          type: string

    ConfirmUploadInput:
      type: object
      required: [imageId, key]
      properties:
        imageId:
          type: string
        key:
          type: string
        width:
          type: number
        height:
          type: number
        size:
          type: number
        tags:
          type: array
          items:
            type: string
        album:
          type: string

    # ─── API Keys ───
    ApiKey:
      type: object
      required: [id, projectId, name, environment, prefix, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        environment:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ApiKeyInput:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
        environment:
          type: string
        scopes:
          type: array
          items:
            type: string

    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string

    # ─── Tokens ───
    Token:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
        revokedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    TokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
